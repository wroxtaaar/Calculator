name: Build Vivo Calculator clone

# Takes the original APK in extracted/VivoCalculator.apk and turns it into your own copy:
#   - its own package name and launcher name, so it installs NEXT TO the system calculator
#   - scientific mode and exchange rate removed from the UI and the manifest (tools/patch_clone.py)
#   - number count under every history entry, long calculations wrap over up to six lines (tools/helper/..., added as classes2.dex)
#   - anything in mods/ laid on top
# then rebuilds and signs it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repackage-vivo-calculator.yml"
      - "mods/**"
      - "tools/**"
      - "extracted/VivoCalculator.apk"

permissions:
  contents: read

concurrency:
  group: vivo-clone-${{ github.ref }}
  cancel-in-progress: true

env:
  NEW_PKG: com.mycalc.vivoclone
  APP_LABEL: Vivo Calc
  APKTOOL_VERSION: "2.9.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download apktool
        run: |
          curl -fsSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"

      - name: Decode original APK
        run: java -jar apktool.jar d -f extracted/VivoCalculator.apk -o work

      - name: Patch the decoded app
        run: python3 tools/patch_clone.py

      - name: Apply mods
        run: |
          if [ -d mods ] && [ -n "$(find mods -type f ! -name 'README.md' | head -1)" ]; then
            echo "Applying mods:"
            find mods -type f ! -name 'README.md' | sort
            rsync -a --exclude 'README.md' mods/ work/
          else
            echo "No mods yet."
          fi

      - name: Compile the add-on
        run: |
          PLATFORM=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "platform: $PLATFORM  build-tools: $BT"
          mkdir -p helper-classes helper-dex
          javac -source 8 -target 8 -Xlint:-options -cp "$PLATFORM/android.jar" \
            -d helper-classes $(find tools/helper -name '*.java')
          "$BT/d8" --min-api 29 --lib "$PLATFORM/android.jar" \
            --output helper-dex $(find helper-classes -name '*.class')
          ls -l helper-dex

      - name: Rebuild
        run: java -jar apktool.jar b work -o unsigned.apk

      - name: Add the add-on to the APK
        run: |
          if unzip -l unsigned.apk | grep -q "classes2.dex"; then
            echo "classes2.dex already exists in the APK, refusing to overwrite it"; exit 1
          fi
          cp helper-dex/classes.dex classes2.dex
          zip -q unsigned.apk classes2.dex
          unzip -l unsigned.apk | grep -E "classes[0-9]*\.dex"

      - name: Align and sign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign \
            --ks signing/clone.keystore --ks-key-alias clone \
            --ks-pass pass:android --key-pass pass:android \
            --out VivoCalcClone.apk aligned.apk
          "$BT/apksigner" verify --print-certs VivoCalcClone.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vivo-calc-clone-apk
          path: VivoCalcClone.apk
          if-no-files-found: error
